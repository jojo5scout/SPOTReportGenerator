# Questionnaire spec, version 2026.1.
#
# Codes and scoring rules only: no item texts, no labels (those belong in the private
# content pack). Display conditions are not modelled (architecture D12).
#
# Notes on reading this file
# - Answer codes are always quoted strings (an unquoted Y would become a boolean).
# - A column is required unless it says `required: false`. Codes, ranges and columns
#   were checked against the structure of the 2026 LimeSurvey survey (ADR 0004).
#   Optional columns exist in that survey but are absent from the synthetic fixtures.
# - Columns of the survey that are not listed here (e.g. ANGE1) are not analysed; the
#   reader keeps them and validation ignores them.

version: "2026.1"

# LimeSurvey system columns. Never analysed; `id` identifies a response. The survey
# is not date-stamped, so `startdate` and `datestamp` are present but empty and
# `submitdate` holds no real time: fieldwork dates come from the survey properties
# (manifest), never from the responses (ADR 0004).
response_id: id
metadata:
  - id
  - submitdate
  - lastpage
  - startlanguage
  - seed
  - startdate
  - datestamp

# Single-choice questions: the set of allowed answer codes. `yes_code` marks a yes/no
# question (exactly two codes) and names the code that means yes.
single_choice:
  DQSEX:
    codes: ["M", "W", "D"]
  DQSTUFE:
    codes: ["Gym1", "Gym2", "Gym3", "Gym4"]
  DIAGQ0:
    # DIAGQ1 to DIAGQ3 are shown only after "Ja".
    codes: ["Ja", "Nein"]
    yes_code: "Ja"
  FEHLTAGQ0:
    codes: ["FEJA", "FENE"]
    yes_code: "FEJA"
  FEHLTAGQ1:
    # Empty when FEHLTAGQ0 is not FEJA (D12: not shown).
    codes: ["FE01", "FE05", "FE10", "FE20"]

# Numeric single questions outside any scale.
numeric:
  DQAGE:
    # A list of the ages 12 to 20 in the survey.
    min: 12
    max: 20
  SIPHQ:
    min: 0
    max: 3

# Multi-select questions: one column `<group>[<option>]` per option. The cell holds
# the `selected` code when the option was ticked and is empty otherwise; empty means
# not selected, the respondent stays in the denominator (D12). `none_option` names the
# option that means "none of the other options".
multi_select:
  DIAGQ1:
    selected: "Y"
    options: [DEPR, ANGS, ESST, ADHS, PTBS, BIPO, PSYC]
    # OTHER is not an option of the survey: "other" is the filled free-text column
    # (ADR 0004); it is replaced together with the metrics that use it.
    optional_options: [BORD, OTHER]
  DIAGQ2:
    selected: "Y"
    options: [NIEM, HAUS, KIND, SCHU, PSYO, PSYA, SELB, BERA]
    # NIEM ("nobody") overrides the other help sources (ADR 0004).
    none_option: NIEM
    optional_options: [KLIN]
  DIAGQ3:
    selected: "Y"
    options: [NOT, MEDI, THER]
    # Every option except NOT counts as a treatment.
    none_option: NOT
    optional_options: [STAT, OTHER]

# Free-text columns: ignored by this program (D14), listed so that later stages know
# them. `group` ties an "other" text column to its multi-select question.
free_text:
  - code: "DIAGQ1[other]"
    group: DIAGQ1
  - code: "DIAGQ2[other]"
    group: DIAGQ2
  - code: "DIAGQ3[other]"
    group: DIAGQ3
  - code: ANGE2
    required: false  # in the survey, absent from the fixtures

# Scales. `range` is the allowed integer range of every item. `scoring: sum` means the
# score is the sum of the items (computed in R12); `scoring: items` means the items are
# analysed one by one and there is no total.
scales:
  PHQ9:
    scoring: sum
    # Standard item range.
    range: [0, 3]
    columns:
      - "PHQ9[PHQQ1]"
      - "PHQ9[PHQQ2]"
      - "PHQ9[PHQQ3]"
      - "PHQ9[PHQQ4]"
      - "PHQ9[PHQQ5]"
      - "PHQ9[PHQQ6]"
      - "PHQ9[PHQQ7]"
      - "PHQ9[PHQQ8]"
      - "PHQ9[PHQQ9]"
  GAD7:
    scoring: sum
    # Standard item range.
    range: [0, 3]
    columns:
      - "GAD7[GADQ1]"
      - "GAD7[GADQ2]"
      - "GAD7[GADQ3]"
      - "GAD7[GADQ4]"
      - "GAD7[GADQ5]"
      - "GAD7[GADQ6]"
      - "GAD7[GADQ7]"
  SBI:
    scoring: sum
    range: [0, 5]
    columns:
      - "SBI[SBIQ0]"
      - "SBI[SBIQ1]"
      - "SBI[SBIQ2]"
      - "SBI[SBIQ3]"
      - "SBI[SBIQ4]"
      - "SBI[SBIQ5]"
      - "SBI[SBIQ6]"
      - "SBI[SBIQ7]"
      - "SBI[SBIQ8]"
    # Two subscales on purpose, as in the previous program: the published third
    # subscale is merged into CYNICISM (ADR 0004). The total uses all items.
    subscales:
      EXHAUSTION:
        - "SBI[SBIQ0]"
        - "SBI[SBIQ3]"
        - "SBI[SBIQ6]"
        - "SBI[SBIQ8]"
      CYNICISM:
        - "SBI[SBIQ1]"
        - "SBI[SBIQ2]"
        - "SBI[SBIQ4]"
        - "SBI[SBIQ5]"
        - "SBI[SBIQ7]"
  RES:
    scoring: sum
    range: [0, 4]
    columns:
      - "RESI[RESIQ1]"
      - "RESI[RESIQ2]"
      - "RESI[RESIQ3]"
      - "RESI[RESIQ4]"
      - "RESI[RESIQ5]"
      - "RESI[RESIQ6]"
      - "RESI[RESIQ7]"
      - "RESI[RESIQ8]"
      - "RESI[RESIQ9]"
      - "RESI[RESIQ10]"
  STIG:
    scoring: items
    # Answer codes 1 to 10 in the survey (the fixtures use 1 to 9 only).
    range: [1, 10]
    columns:
      - StigmaQ1
      - StigmaQ2
      - StigmaQ3
      - StigmaQ4
      - StigmaQ5
