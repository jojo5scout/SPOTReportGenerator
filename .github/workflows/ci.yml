# Lint, data guard and tests on every push and pull request.
# Third-party actions are pinned to commit SHAs; the comment names the release.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, data guard, tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Pango (WeasyPrint)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libpango-1.0-0 libpangoft2-1.0-0

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      # All pre-commit hooks except the name checks, which need the untracked
      # .denylist.txt and only run locally.
      - name: Data guard
        env:
          SKIP: name-check,name-check-msg
        run: uv run pre-commit run --all-files --show-diff-on-failure

      - name: Ruff lint
        run: uv run ruff check --output-format=github .

      - name: Ruff format
        run: uv run ruff format --check .

      - name: Tests
        run: uv run pytest
